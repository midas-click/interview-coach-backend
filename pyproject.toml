[project]
name = "interview-intelligence-backend"
version = "0.1.0"
description = "Event-driven AI interview intelligence platform backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "inngest>=0.5,<1",
    "openai>=1.30",
    "boto3>=1.34",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pyjwt>=2.8",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"api/routers/interviews.py" = ["B008"]
"api/routers/auth.py" = ["B008"]
"api/routers/users.py" = ["B008"]
"api/deps.py" = ["B008"]
"tests/integration/*" = ["ASYNC230", "ASYNC240", "E701", "SIM115"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["alembic/versions"]
